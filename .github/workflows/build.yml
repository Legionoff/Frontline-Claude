name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - name: Build
        run: gradle build --stacktrace
      - name: API diagnostics
        if: failure()
        run: |
          J=$HOME/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/26.3/minecraft-merged-deobf-26.3.jar
          javap -cp "$J" net.minecraft.world.level.block.ColorCollection | head -30
          javap -cp "$J" net.minecraft.world.inventory.ContainerInput | head -20
          unzip -l "$J" | grep -E 'blaze3d/platform/InputConstants' | head
          javap -cp "$J" -constants 'net.minecraft.client.KeyMapping' | grep -E 'KeyMapping\(|Category' | head
          unzip -l "$J" | grep -E 'client/KeyMapping' | head
          F=$(find ~/.gradle -name 'fabric-networking-api-v1*.jar' -not -name '*sources*' | head -1)
          echo "NET: $F"
          javap -cp "$F" net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry | head -20
          K=$(find ~/.gradle -name 'fabric-key-mapping-api-v1*.jar' -not -name '*sources*' | head -1)
          echo "KEY: $K"
          unzip -l "$K" | grep -i class | head
      - uses: actions/upload-artifact@v4
        with:
          name: frontline-gamemode
          path: build/libs/*.jar
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f build/libs/*-sources.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar --title "Latest build" --notes "Automatic build from main ($GITHUB_SHA)"

name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - name: Build
        run: gradle build --stacktrace
      - name: API diagnostics
        if: failure()
        run: |
          J=$(find ~/.gradle -name 'minecraft*.jar' -not -name '*sources*' | head -5)
          echo "JARS: $J"
          for j in $J; do
            echo "== $j"
            unzip -l "$j" | grep -E 'world/inventory/.*Click|world/inventory/Container[A-Z]' | head -20
            javap -cp "$j" net.minecraft.world.item.Items | grep -E 'CONCRETE|BANNER|GLASS_PANE' | head -20
            javap -cp "$j" net.minecraft.server.level.ServerBossEvent | head -20
            javap -cp "$j" com.mojang.blaze3d.platform.InputConstants\$Type | head -20
            javap -cp "$j" net.minecraft.world.inventory.AbstractContainerMenu | grep -E 'clicked|Click|Input' | head
          done
          F=$(find ~/.gradle -name 'fabric-networking-api-v1*.jar' -not -name '*sources*' | head -1)
          echo "NET: $F"
          javap -cp "$F" net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: frontline-gamemode
          path: build/libs/*.jar
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f build/libs/*-sources.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar --title "Latest build" --notes "Automatic build from main ($GITHUB_SHA)"

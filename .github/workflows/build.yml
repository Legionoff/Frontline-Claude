name: build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      - name: Build
        run: gradle build --stacktrace
      - name: Server smoke test
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'cappoint create A\ncappoint create "Центр"\ncappoint edge A pos1 0 60 0\ncappoint edge A pos2 5 65 5\ncappoint edge "Центр" pos1 10 60 0\ncappoint edge "Центр" pos2 15 65 5\ncappoint list\nfrontline time capture 5\nfrontline time hold 5\nfrontline start\nfrontline pause\nfrontline resume\nfrontline swap\nfrontline preset save test\nfrontline preset list\nfrontline stop\nstop\n' > /tmp/cmds.txt
          (sleep 90; cat /tmp/cmds.txt; sleep 25) | timeout 400 gradle runServer --no-daemon 2>&1 | tee /tmp/server.log || true
          grep -q "Frontline Gamemode loaded" /tmp/server.log
          ! grep -E "Exception|ERROR" /tmp/server.log | grep -vi "WARN" | grep -i frontline
          grep -E "Point A created|Capture points|Round started|Preset test saved|Presets:" /tmp/server.log
      - uses: actions/upload-artifact@v4
        with:
          name: frontline-gamemode
          path: build/libs/*.jar
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f build/libs/*-sources.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar --title "Latest build" --notes "Automatic build from main ($GITHUB_SHA)"
